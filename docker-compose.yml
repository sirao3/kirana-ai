services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kiranaai
      POSTGRES_PASSWORD: kiranaai
      POSTGRES_DB: kiranaai
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiranaai"]
      interval: 2s
      retries: 30
  server:
    build: .
    profiles: [app]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://kiranaai:kiranaai@postgres:5432/kiranaai
      PORT: "8080"
      SELF_BASE_URL: http://127.0.0.1:8080
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
