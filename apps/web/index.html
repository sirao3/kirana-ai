<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="KiranaAI: agentic commerce for kirana stores on Beckn/ONDC." />
    <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
    
    <title>KiranaAI</title>
    <style>
      /* Critical-path skeleton: paints before JS. Mirrors the landing page: map-coloured stage + the floating card. */
      body { margin: 0; background: #F3F1EC; }
      #boot { min-height: 100vh; background: #F3F1EC; }
      #boot .card { position: absolute; left: 12px; right: 12px; top: 40vh; bottom: 12px; border-radius: 26px; background: rgba(255,255,255,0.86); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06), 0 18px 50px rgba(0,0,0,0.14); }
      #boot .line { height: 14px; border-radius: 7px; background: #ECEAE6; margin: 24px 24px 0; }
      #boot .line.big { height: 36px; margin-top: 40px; width: 70%; }
      #boot .line.btn { height: 54px; border-radius: 16px; background: #1D1D1F; margin-top: 28px; }
      @media (min-width: 840px) { #boot .card { left: 16px; right: auto; top: 16px; bottom: 16px; width: 420px; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div class="card"><div class="line" style="width: 30%"></div><div class="line big"></div><div class="line"></div><div class="line btn"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
